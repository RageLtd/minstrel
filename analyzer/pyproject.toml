[project]
name = "minstrel-analyzer"
version = "0.1.0"
description = "Minstrel audio analysis worker: CLAP embeddings + librosa features"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "librosa==0.11.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
]

# Worker, not a distributable package — skip the build backend.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
